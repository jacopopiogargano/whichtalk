name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.x']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -I -m unittest discover tests

  e2e:
    name: End-to-end (headless Chrome)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Let Chrome use its sandbox (Ubuntu 24.04 restricts user namespaces)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Serve docs/ and run the suite
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          python3 -m http.server 8000 --directory docs &
          for i in $(seq 1 20); do curl -fs -o /dev/null http://localhost:8000/ && break; sleep 0.5; done
          node tests/e2e.mjs --url http://localhost:8000/neurips/2026/
